[package]
name = "digital-euro-wallet"
version = "0.1.0"
edition = "2021"
# The dependency pins below are chosen to build on this toolchain. Declaring it
# also keeps clippy from suggesting APIs that are newer than what is supported
# (`u64::is_multiple_of`, for one, landed well after 1.75).
rust-version = "1.75"
description = "Model of the offline digital euro: secure-element balances, certified devices, local settlement"
license = "MIT OR Apache-2.0"

[dependencies]
sha2 = "=0.10.8"
num-bigint = { version = "=0.4.4", features = ["rand"] }
num-integer = "=0.1.46"
num-traits = "=0.2.18"
rand = "=0.8.5"

[profile.release]
debug = false
